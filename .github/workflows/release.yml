---
# Tags django-layout releases (v*) from conventional
# commit titles so consumers can track which version of the standard they
# follow. Repo-only: startproject runs with --exclude=.github, so it never
# reaches generated projects.
name: Release

"on":
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub App Token
        id: get_token
        uses: actions/create-github-app-token@v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.get_token.outputs.token }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"

      - name: Release
        working-directory: .github/release
        run: |
          npm ci
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
